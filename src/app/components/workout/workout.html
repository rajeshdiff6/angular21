@let user = "some user";
<h3>{{ title }}</h3>
<button id="message">Send message</button>
<h4>{{body}}</h4>
<input type="text" [(ngModel)]="street" />{{street|uppercase}}
@if(a > b){
    <h2>a is greater than b</h2>
} @else {
    <h4>b is greater than a</h4>
}
<ul>
@for(fruit of fruits; track fruit) {
    <li>{{fruit}}</li>
}
</ul>

<div>{{user | workout: 'dfa'}}</div>
