<!-- Modal Backdrop -->
<div class="modal-backdrop" *ngIf="isOpen" (click)="closeModal()"></div>

<!-- Modal Container -->
<div class="modal-container" [ngClass]="{ 'modal-active': isOpen }">
  <div class="modal-content">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 class="modal-title">{{ title }}</h2>
      <button class="modal-close-btn" (click)="closeModal()" aria-label="Close modal">
        <span>&times;</span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <p>{{ message }}</p>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="confirmModal()">Confirm</button>
    </div>
  </div>
</div>
